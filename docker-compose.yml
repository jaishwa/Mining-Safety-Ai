services:
  mining-safety-ai:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN:-}
      ROBOFLOW_API_KEY: ${ROBOFLOW_API_KEY:-}
    restart: unless-stopped
